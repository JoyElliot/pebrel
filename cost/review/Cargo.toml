[package]
name="pr316-cost"
version="0.1.0"
edition="2024"
[workspace]
[dependencies]
nebula_terminal={path="../sources/review/nebula_terminal"}
serde_json="1.0"
[features]
images=[]
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
[[bin]]
name="text-cost"
path="text-cost.rs"
[[bin]]
name="image-cost"
path="image-cost.rs"
required-features=["images"]
[[bin]]
name="memory"
path="memory.rs"
[[bin]]
name="term-workloads"
path="term-workloads.rs"
